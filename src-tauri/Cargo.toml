[package]
name = "remora"
version = "0.1.0"
edition = "2021"

[lib]
name = "remora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["time", "sync"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
cpal = "0.15"
hound = "3"
sha2 = "0.10"
arboard = "3"
enigo = "0.2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
active-win-pos-rs = "0.9"
window-vibrancy = "0.6"
whisper-rs = "0.16.0"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"

[profile.release]
opt-level = 3
lto = true
